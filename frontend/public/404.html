<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#024D3E" />
    <title>Page introuvable · Semaine de l’industrie 2026</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #fff;
        color: #0f1f1a;
        font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 36rem; }
      p.kicker {
        margin: 0 0 0.75rem;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #024d3e;
      }
      h1 {
        margin: 0;
        font-family: "Bricolage Grotesque", "Space Grotesk", sans-serif;
        font-size: clamp(2rem, 1.4rem + 2vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        color: #024d3e;
      }
      p.lead {
        margin: 1rem 0 1.75rem;
        font-size: 1.0625rem;
        line-height: 1.6;
        color: color-mix(in oklab, #0f1f1a 70%, white);
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.5rem;
        padding: 0.5rem 1.1rem;
        background: #024d3e;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Erreur 404</p>
      <h1>Cette page n’existe pas.</h1>
      <p class="lead">
        Le lien est incorrect ou la page a été déplacée. Retrouvez le programme,
        les usines ouvertes et les inscriptions sur l’accueil.
      </p>
      <a href="/">Retour à l’accueil</a>
    </main>
  </body>
</html>
