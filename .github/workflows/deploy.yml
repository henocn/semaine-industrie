# Deploy to VPS on every push to main (and manual runs).
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Host key pinning (ssh-keyscan -H host, or content of known_hosts line).
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          # Forced command on the deploy key should run scripts/deploy.sh;
          # this invocation is what GitHub Actions expects to fail the job on error.
          script_stop: true
          command_timeout: 15m
          script: |
            /var/www/semaine-industrie/scripts/deploy.sh
