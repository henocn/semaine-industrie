# Nginx — Semaine de l'industrie 2026
# Domaine charte : semaine-industrie.mdpise.tg
#
# Installation :
#   sudo cp deploy/nginx/semaine-industrie.conf /etc/nginx/sites-available/semaine-industrie
#   sudo ln -sf /etc/nginx/sites-available/semaine-industrie /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d semaine-industrie.mdpise.tg -d www.semaine-industrie.mdpise.tg
#
# Front servi depuis : /var/www/semaine-industrie/frontend  (sortie de deploy/deploy.sh)
# API Node (systemd) : 127.0.0.1:3000

upstream semaine_industrie_api {
    server 127.0.0.1:3000;
    keepalive 8;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name semaine-industrie.mdpise.tg www.semaine-industrie.mdpise.tg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Site public (+ orga via le même build React)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name semaine-industrie.mdpise.tg www.semaine-industrie.mdpise.tg;

    # Remplacés / complétés par Certbot si besoin
    ssl_certificate     /etc/letsencrypt/live/semaine-industrie.mdpise.tg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/semaine-industrie.mdpise.tg/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/semaine-industrie/frontend;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Empreintes Vite : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Photos statiques du site
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Charte / logos
    location /brand/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA : jamais en cache pour voir les mises à jour
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Uploads (galeries industries) → API
    location /uploads/ {
        proxy_pass http://semaine_industrie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API Express
    location /api/ {
        proxy_pass http://semaine_industrie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Socket.IO (questions / votes live)
    location /socket.io/ {
        proxy_pass http://semaine_industrie_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }
}

