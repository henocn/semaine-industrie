# Nginx — Semaine de l'industrie 2026
# Copier vers /etc/nginx/sites-available/semaine-industrie
# puis : ln -s …/sites-available/semaine-industrie …/sites-enabled/
# Certbot : certbot --nginx -d semaine-industrie.mdpise.tg -d www.semaine-industrie.mdpise.tg

upstream semaine_industrie_api {
    server 127.0.0.1:3000;
    keepalive 8;
}

# Site public (+ admin via même build)
server {
    listen 80;
    listen [::]:80;
    server_name semaine-industrie.mdpise.tg www.semaine-industrie.mdpise.tg;

    root /var/www/semaine-industrie/frontend;
    index index.html;

    client_max_body_size 12m;

    # Images uploadées (galeries industries)
    location /uploads/ {
        proxy_pass http://semaine_industrie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API → Node (systemd)
    location /api/ {
        proxy_pass http://semaine_industrie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Socket.IO (questions / votes live)
    location /socket.io/ {
        proxy_pass http://semaine_industrie_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
