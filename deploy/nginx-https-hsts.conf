# HTTPS / HSTS / en-têtes / 404 réel — Semaine de l'industrie
# Appliqué à la main par root (PAS par deploy/deploy.sh).
#
# Prérequis : le port 80 doit être OUVERT dans le pare-feu Hostinger
# (redirection HTTP→HTTPS + renouvellement Certbot).
#
# Application (root, sur le VPS) :
#   sudo cp /var/www/semaine-industrie/deploy/nginx-https-hsts.conf \
#     /etc/nginx/sites-available/semaineindustrie.tg
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ce fichier remplace le vhost public. Certificats Let's Encrypt inchangés.

upstream industrie_api {
    server 127.0.0.1:3005;
    keepalive 8;
}

# HTTP → HTTPS canonique (apex). www aussi.
server {
    listen 80;
    listen [::]:80;
    server_name semaineindustrie.tg www.semaineindustrie.tg;
    return 301 https://semaineindustrie.tg$request_uri;
}

# HTTPS www → hôte canonique (sans www).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.semaineindustrie.tg;

    ssl_certificate /etc/letsencrypt/live/semaineindustrie.tg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/semaineindustrie.tg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://semaineindustrie.tg$request_uri;
}

# Site public HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name semaineindustrie.tg;

    ssl_certificate /etc/letsencrypt/live/semaineindustrie.tg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/semaineindustrie.tg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    root /var/www/semaine-industrie/frontend/dist;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    # CSP : Google Tag Manager / Analytics autorisés (sinon la mesure d'audience est coupée).
    # Scripts inline autorisés un par un par empreinte (classe .js, dataLayer, garde du pré-rendu,
    # révélation Suspense de React) : recalculer avec `node frontend/scripts/csp-hashes.mjs`
    # après un build si index.html, scripts/prerender.mjs ou la version de React changent.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' 'sha256-WFRMLsMGdvJeEZAYZrUympeBpc2cT0AELK1vPulFTTM=' 'sha256-B6GsLQS+3LTXdyoQMp4z6S6Al0mmaemtXhlsz9VE0s0=' 'sha256-7mu4H06fwDCjmnxxr/xNHyuQC6pLTHr4M2E4jXw5WZs=' 'sha256-QAlSewaQLi/NPCznjAZSyvQ72heD0VdxmNDDkZeCxgc=' https://www.googletagmanager.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    error_page 404 /404.html;

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        try_files $uri =404;
    }

    location /brand/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /404.html {
        expires -1;
    }

    # Espaces privés : pas d'indexation + redirection backoffice.
    # add_header répété : nginx n'hérite pas si le bloc a déjà un add_header.
    location = /login {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 https://backoffice.semaineindustrie.tg/login;
    }

    location = /bilan {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 https://backoffice.semaineindustrie.tg/orga;
    }

    location ^~ /orga {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 https://backoffice.semaineindustrie.tg$request_uri;
    }

    location /uploads/ {
        proxy_pass http://industrie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://industrie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /socket.io/ {
        proxy_pass http://industrie_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Routes applicatives dynamiques ou de redirection (pas de HTML pré-rendu) :
    # coquille vide app.html (noindex), rendue côté client.
    location ~ ^/(o|passage|passeport|questions|questionnaire|inscription|ressources)(/|$) {
        try_files $uri $uri/index.html /app.html;
    }

    location = /app.html {
        expires -1;
    }

    # Pages publiques pré-rendues : fichier réel, sinon 404 (pas de fallback SPA).
    # expires -1 : le HTML est revalidé à chaque visite (il pointe vers les assets du dernier build).
    location / {
        expires -1;
        try_files $uri $uri/index.html =404;
    }
}
